modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"

[[mods]]
modId = "hotairballoons"
version = "${version}"
displayName = "${name}"
authors = "${author}"
displayURL = "${homepage}"
logoFile = "assets/hotairballoons/icon.png"
logoBlur = false
description = '''${description}'''
displayTest = "MATCH_VERSION"

[[mixins]]
config = "hotairballoons.mixins.json"

[[dependencies.hotairballoons]]
modId = "minecraft"
type = "required"
versionRange = "[${mc},${mc_next})"
ordering = "NONE"
side = "BOTH"
