// Forge 1.21.1 build of Hot Air Balloons. Forge 1.21.1 needs ForgeGradle 6 (the Stonecutter project has no ForgeGradle 6 target),
// so this is a small project of its own that compiles the 1.21.1 sources Stonecutter generated for the Fabric target
// (../versions/1.21.1-fabric) minus the platform packages (platform/forge there is the 26.x code), plus its own
// platform/forge entry classes in src/. The data pack files come from the Fabric target's processed resources, where
// dev/data.gradle.kts has rewritten them for 1.21.1.
// Forge 1.21.1 runs with Mojang names, so there is no refmap and no reobfuscation of the jar.
// Run it with JAVA_HOME=~/Tools/jdk21 and Gradle 8.14 (ForgeGradle 6 does not run on Gradle 9):
//   JAVA_HOME=~/Tools/jdk21 ~/.gradle/wrapper/dists/gradle-8.14.3-bin/*/gradle-8.14.3/bin/gradle build
// after `./gradlew :1.21.1-fabric:compileJava` in the parent so the generated sources are current (mt.py and
// tools/Backport/port.py do both).
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

def props = new Properties()
file('../gradle.properties').withInputStream { props.load(it) }
def modId = props['mod.id']
version = props['mod.version'] + '+1.21.1-forge'
group = props['mod.group']
base { archivesName = modId }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    accessTransformer = file('../dev/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--username', 'Builder'
            mods { hotairballoons { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

jarJar.enable()

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.16'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) { jarJar.ranged(it, '[0.4.1,)') }
}

def generated = file('../versions/1.21.1-fabric/build/generated/legacy/main/java')
def prep = tasks.register('prepSources', Sync) {
    from generated
    inputs.file(buildFile)
    exclude 'io/github/profetgit/hotairballoons/platform/fabric/**', 'io/github/profetgit/hotairballoons/platform/neoforge/**',
        'io/github/profetgit/hotairballoons/platform/forge/**'
    into layout.buildDirectory.dir('src')
}
sourceSets.main.java.srcDirs = [layout.buildDirectory.dir('src'), file('src')]
tasks.named('compileJava') { dependsOn prep }
sourceSets.main.resources.srcDirs = []
def fabricResources = file('../versions/1.21.1-fabric/build/resources/main')
processResources {
    inputs.dir(fabricResources)
    from('../src/main/resources') { eachFile { if (it.path.startsWith('data/')) it.exclude() } }
    from(fabricResources) { include 'data/**' }
    from(file('../dev/accesstransformer.cfg')) { into 'META-INF' }
    includeEmptyDirs = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    exclude 'fabric.mod.json', 'META-INF/neoforge.mods.toml'
    def p = [version: project.version.toString(), mc: '1.21.1', mc_next: '1.22', name: props['mod.name'],
             description: props['mod.description'], author: props['mod.author'], homepage: props['mod.homepage']]
    inputs.properties(p)
    inputs.file(buildFile)
    filesMatching('META-INF/mods.toml') { expand(p) }
    filesMatching('pack.mcmeta') {
        filter { line -> line.contains('"min_format"') ? '    "pack_format": 34' : (line.contains('"max_format"') ? null : line) }
    }
}

jar {
    from(rootProject.file('../LICENSE'))
    manifest { attributes 'MixinConfigs': 'hotairballoons.mixins.json' }
}

tasks.jarJar.configure {
    archiveClassifier = ''
    manifest { attributes 'MixinConfigs': 'hotairballoons.mixins.json' }
    finalizedBy 'publishForTests'
}
tasks.named('assemble') { dependsOn 'jarJar' }
jar { archiveClassifier = 'slim' }
tasks.register('publishForTests', Copy) {
    from layout.buildDirectory.dir('libs')
    include 'hotairballoons-*+1.21.1-forge.jar'
    into file('../versions/1.21.1-forge/build/libs')
}
